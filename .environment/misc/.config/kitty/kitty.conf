# ==============================
# Theming
# ==============================
include                    colors.conf
single_window_margin_width 0 4 2 4
background_opacity         0.98
background_blur            100

# ==============================
# Cursor
# ==============================
cursor_trail          3
cursor_trail_decay    0.1 0.3
cursor_blink_interval 0.65
cursor_shape          block

# ==============================
# Tab bar
# ==============================
tab_bar_style       separator
tab_bar_align       right
tab_activity_symbol "×"
tab_separator       "⠀+⠀"
tab_title_template  "⠀{index}⠀"

# ==============================
# Font
# ==============================
font_size        14
font_family      family="Cozette"
bold_font        auto
italic_font      auto
bold_italic_font auto

# ==============================
# Terminal window
# ==============================
shell             /opt/homebrew/bin/fish
shell_integration enabled
shell_integration no-cursor

copy_on_select yes
mouse_map      right press ungrabbed paste_from_selection

scrollback_lines 1000
scrollbar        never

remember_window_size  no
initial_window_width  63c
initial_window_height 15c

close_on_child_death yes

# ==============================
# Mapping
# ==============================
map ctrl+t new_tab
map ctrl+h previous_tab
map ctrl+l next_tab

map ctrl+1 goto_tab 1
map ctrl+2 goto_tab 2
map ctrl+3 goto_tab 3
map ctrl+4 goto_tab 4
map ctrl+5 goto_tab 5
map ctrl+6 goto_tab 6
map ctrl+7 goto_tab 7
map ctrl+8 goto_tab 8
map ctrl+9 goto_tab 9

map shift+up   scroll_line_up
map shift+down scroll_line_down

# ==============================
# macOS settings
# ==============================
macos_show_window_title_in         none
macos_menubar_title_max_length     0
macos_quit_when_last_window_closed yes
